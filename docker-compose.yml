services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: artifact
      POSTGRES_PASSWORD: artifact
      POSTGRES_DB: artifact
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Over TCP on purpose: on first start the image runs a temporary server for init that listens only on the
    # socket, so a socket check passes and then the server shuts down under whoever trusted it
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'artifact', '-h', '127.0.0.1']
      interval: 2s
      timeout: 5s
      retries: 30

  # Catches outgoing mail locally; open http://localhost:8025 to read it
  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

  # Object storage for page content and thumbnails; console at http://localhost:9001 (artifact / artifact-secret)
  minio:
    image: pgsty/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: artifact
      MINIO_ROOT_PASSWORD: artifact-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
