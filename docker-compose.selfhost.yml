# Self-hosted The Artifact: the app, its Postgres database and MinIO for page content.
# Passwords and other storage come from a .env file next to this one (see docs/self-hosting.md).
# Setup: cp .env.selfhost.example .env.selfhost, edit it, then
#   docker compose -f docker-compose.selfhost.yml up -d
services:
  app:
    build: .
    image: the-artifact:latest
    restart: unless-stopped
    ports:
      - '${ARTIFACT_PORT:-8080}:3000'
    env_file: .env.selfhost
    # Docker's default seccomp profile plus the namespace calls Chromium's sandbox needs to render
    # thumbnails of untrusted pages safely (see docs/security.md)
    security_opt:
      - seccomp=./docker/seccomp-chromium.json
    environment:
      DATABASE_URL: postgres://artifact:${POSTGRES_PASSWORD:-artifact}@db:5432/artifact
      # The bundled MinIO unless .env points somewhere else (S3, R2, your own MinIO)
      S3_ENDPOINT: ${S3_ENDPOINT-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-artifact}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-artifact}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-artifact-secret}}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: artifact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artifact}
      POSTGRES_DB: artifact
    volumes:
      - artifact-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U artifact']
      interval: 5s
      timeout: 5s
      retries: 10

  # Page content and thumbnails. Its console isn't published; reach it with an SSH tunnel if needed.
  # Community build of MinIO (the minio/minio image is no longer published)
  minio:
    image: pgsty/minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: artifact
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-artifact-secret}
    volumes:
      - artifact-content:/data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  artifact-data:
  artifact-content:
