{{- if .Values.ingress.enabled }}
{{- $hosts := list (required "Set ingress.host when ingress.enabled is true." .Values.ingress.host) }}
{{- with .Values.contentOrigin }}
{{- $hosts = append $hosts (urlParse .).hostname }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "the-artifact.fullname" . }}
  labels:
    {{- include "the-artifact.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "the-artifact.fullname" $ }}
                port:
                  name: http
    {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ default (printf "%s-tls" (include "the-artifact.fullname" .)) .Values.ingress.tls.secretName }}
  {{- end }}
{{- end }}
