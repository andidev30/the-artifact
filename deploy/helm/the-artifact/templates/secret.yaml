{{- /* The app's secret settings given in values, keyed by setting name; the pod reads it whole */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "the-artifact.fullname" . }}
  labels:
    {{- include "the-artifact.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.postgresql.enabled }}
  {{- with .Values.externalDatabase }}
  {{- if .url }}
  DATABASE_URL: {{ .url | quote }}
  {{- else if not .existingSecret }}
  {{- $password := .password | default "" | urlquery | replace "+" "%20" }}
  {{- $userinfo := ternary (printf "%s:%s" (.user | urlquery) $password) (.user | urlquery) (ne $password "") }}
  DATABASE_URL: {{ printf "postgres://%s@%s:%v/%s%s" $userinfo (required "Set externalDatabase.url or externalDatabase.host when postgresql.enabled is false." .host) .port .database (ternary (printf "?%s" .params) "" (ne .params "")) | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if and (not .Values.minio.enabled) (not .Values.externalS3.existingSecret) }}
  {{- with .Values.externalS3.accessKeyId }}
  S3_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.externalS3.secretAccessKey }}
  S3_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.smtp.password }}
  SMTP_PASS: {{ . | quote }}
  {{- end }}
  {{- with .Values.google.clientSecret }}
  GOOGLE_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- if .Values.metrics.token }}
  METRICS_TOKEN: {{ .Values.metrics.token | quote }}
  {{- else if include "the-artifact.metricsTokenGenerated" . }}
  METRICS_TOKEN: {{ include "the-artifact.stableSecret" (list $ "" (include "the-artifact.fullname" .) "METRICS_TOKEN") | quote }}
  {{- end }}
