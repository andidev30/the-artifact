{{- if .Values.metrics.serviceMonitor.enabled }}
{{- /* The token comes from metrics.token, else METRICS_TOKEN in existingSecret, else one the chart generates */}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "the-artifact.fullname" . }}
  labels:
    {{- include "the-artifact.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "the-artifact.selectorLabels" (list . "app") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      authorization:
        type: Bearer
        credentials:
          name: {{ ternary .Values.existingSecret (include "the-artifact.fullname" .) (and (not .Values.metrics.token) (ne .Values.existingSecret "")) }}
          key: METRICS_TOKEN
{{- end }}
