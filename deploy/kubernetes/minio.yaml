# The bundled MinIO for page content and thumbnails; only the app reaches it. To use S3, R2 or
# another store, remove this file from kustomization.yaml and put its settings in app.env.
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - port: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      containers:
        # Community build of MinIO (the minio/minio image is no longer published)
        - name: minio
          image: pgsty/minio
          args: ['server', '/data']
          env:
            # The app's S3 key is MinIO's root account
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: the-artifact
                  key: S3_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: the-artifact
                  key: S3_SECRET_ACCESS_KEY
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 20Gi
