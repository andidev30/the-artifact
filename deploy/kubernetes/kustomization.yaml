# The Artifact on Kubernetes (k3s, k8s): the app, Postgres and MinIO in one namespace.
# See docs/kubernetes.md. In short:
#   cp deploy/kubernetes/app.env.example deploy/kubernetes/app.env   # then edit it
#   kubectl apply -k deploy/kubernetes
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: the-artifact

resources:
  - namespace.yaml
  - postgres.yaml
  - minio.yaml
  - app.yaml
  - ingress.yaml

# The published image at the release this checkout is from. Set newTag to another release (or its
# major.minor, e.g. '0.2'), or point this at your own build (see docs/kubernetes.md and docs/upgrading.md)
images:
  - name: the-artifact
    newName: ghcr.io/andidev30/the-artifact
    newTag: '0.3.0' # x-release-please-version

# Every setting, in one Secret: the app reads all of it, Postgres and MinIO their passwords
secretGenerator:
  - name: the-artifact
    envs:
      - app.env

# Uncomment when you can't install the seccomp profile on your nodes (see docs): the app then runs
# without gallery thumbnails, under the runtime's default seccomp profile
# patches:
#   - path: patches/thumbnails-off.yaml
