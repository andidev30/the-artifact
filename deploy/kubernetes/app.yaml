apiVersion: v1
kind: Service
metadata:
  name: the-artifact
spec:
  selector:
    app.kubernetes.io/name: the-artifact
  ports:
    - port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-artifact
spec:
  # One pod: it migrates the database on start and keeps the wrong-password limits in memory.
  # Recreate stops the old pod before the new one starts, so two never migrate at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: the-artifact
  template:
    metadata:
      labels:
        app.kubernetes.io/name: the-artifact
    spec:
      securityContext:
        runAsNonRoot: true
        # The image's node user
        runAsUser: 1000
        runAsGroup: 1000
        # Docker's default profile plus the namespace calls Chromium's sandbox needs to render
        # thumbnails of untrusted pages safely. It has to be on every node that can run this pod,
        # at /var/lib/kubelet/seccomp/profiles/the-artifact-chromium.json (see docs/self-hosting.md),
        # or the pod doesn't start; patches/thumbnails-off.yaml runs without it.
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/the-artifact-chromium.json
      initContainers:
        # Waits until the database and object storage accept connections, like depends_on in
        # docker compose, so the first start doesn't crash while Postgres is still starting.
        # Reads their addresses from the settings, so it works with your own Postgres or S3 too.
        - name: wait-for-services
          image: the-artifact
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: the-artifact
          command:
            - node
            - -e
            - |
              const net = require('node:net')
              const targets = [process.env.DATABASE_URL, process.env.S3_ENDPOINT]
                .filter(Boolean)
                .map((u) => new URL(u))
                .map((u) => ({ host: u.hostname, port: Number(u.port) || (u.protocol === 'https:' ? 443 : u.protocol === 'http:' ? 80 : 5432) }))
              const open = ({ host, port }) => new Promise((ok) => {
                const s = net.connect({ host, port, timeout: 2000 }, () => { s.end(); ok(true) })
                s.on('error', () => ok(false)).on('timeout', () => { s.destroy(); ok(false) })
              })
              ;(async () => {
                for (const t of targets) {
                  while (!(await open(t))) {
                    console.log(`Waiting for ${t.host}:${t.port}`)
                    await new Promise((r) => setTimeout(r, 2000))
                  }
                }
              })()
      containers:
        - name: app
          image: the-artifact
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: the-artifact
          ports:
            - name: http
              containerPort: 3000
          # The first start migrates the database, so give it time before the other probes count
          startupProbe:
            httpGet:
              path: /api/config
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/config
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/config
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              # Headroom for Chromium while it renders thumbnails
              memory: 1536Mi
          volumeMounts:
            # Chromium keeps shared memory here; the runtime's default 64 MB is tight
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
