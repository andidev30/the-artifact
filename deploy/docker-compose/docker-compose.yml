# Self-hosted The Artifact: the app, its Postgres database and MinIO for page content.
# From this folder (see docs/self-hosting.md):
#   cp app.env.example app.env     # the app's settings
#   cp .env.example .env           # passwords, port and storage, read by docker compose itself
#   docker compose up -d
#
# It runs the published image, pinned to ARTIFACT_VERSION in .env. To build the image from this
# checkout instead, add docker-compose.build.yml (see its first lines).
#
# The project keeps the name it had when this file lived at the repository root, so installs that
# moved here keep their volumes. If you cloned into a folder other than the-artifact, set the name
# to that folder's name (docker volume ls shows it before _artifact-data).
name: the-artifact

services:
  app:
    image: ghcr.io/andidev30/the-artifact:${ARTIFACT_VERSION:-0.6.1} # x-release-please-version
    restart: unless-stopped
    ports:
      - '${ARTIFACT_PORT:-8080}:3000'
    env_file: app.env
    # Docker's default seccomp profile plus the namespace calls Chromium's sandbox needs to render
    # thumbnails of untrusted pages safely (see docs/security.md)
    security_opt:
      - seccomp=../seccomp-chromium.json
    environment:
      DATABASE_URL: postgres://artifact:${POSTGRES_PASSWORD:-artifact}@db:5432/artifact
      # The bundled MinIO unless .env points somewhere else (S3, R2, your own MinIO)
      S3_ENDPOINT: ${S3_ENDPOINT-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-artifact}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-artifact}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-artifact-secret}}
    # Healthy once Postgres and object storage answer (GET /readyz). The image has no curl, so Node asks.
    # The first start migrates the database before the server listens, hence the start period.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5m
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: artifact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artifact}
      POSTGRES_DB: artifact
    volumes:
      - artifact-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U artifact -h 127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 10

  # Page content and thumbnails. Its console isn't published; reach it with an SSH tunnel if needed.
  # Community build of MinIO (the minio/minio image is no longer published)
  minio:
    image: pgsty/minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: artifact
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-artifact-secret}
    volumes:
      - artifact-content:/data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  artifact-data:
  artifact-content:
