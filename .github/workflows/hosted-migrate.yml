name: Hosted migrate

# Deploys the hosted service: applies new migrations to its database, then starts the production
# deployment through the Vercel deploy hook, only after the migrations are in. It runs when a server
# release is published (called from release.yml, since events made with the workflow token start no
# other workflow) and by hand with `gh workflow run hosted-migrate.yml` for a hotfix. Merges to main
# don't deploy: each deployment counts against Vercel's daily limit, and production should run a
# release. vercel.json turns Vercel's own git deployments off. The Vercel function never runs
# migrations. A backup runs before any migration and is kept like the nightly ones. Setup:
# ee/ops/runbook.md.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: hosted-migrate
  cancel-in-progress: false

permissions:
  contents: read

env:
  PG_MAJOR: 17

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - id: configured
        env:
          HOSTED_DATABASE_URL: ${{ secrets.HOSTED_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          if [ -n "$HOSTED_DATABASE_URL" ] && [ -n "$BACKUP_AGE_RECIPIENT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Migrations are off: set HOSTED_DATABASE_URL and BACKUP_AGE_RECIPIENT (see ee/ops/runbook.md)"
          fi

      - if: steps.configured.outputs.ok == 'true'
        uses: actions/checkout@v7

      - if: steps.configured.outputs.ok == 'true'
        name: Install age and the Postgres client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends age "postgresql-client-$PG_MAJOR"
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"

      - if: steps.configured.outputs.ok == 'true'
        id: pending
        name: Count pending migrations
        env:
          DATABASE_URL: ${{ secrets.HOSTED_DATABASE_URL }}
        run: |
          expected=$(grep -c '"tag"' apps/api/drizzle/meta/_journal.json)
          applied=$(psql "$DATABASE_URL" -Atc "select count(*) from drizzle.__drizzle_migrations")
          echo "count=$((expected - applied))" >> "$GITHUB_OUTPUT"
          echo "$applied of $expected migrations applied" >> "$GITHUB_STEP_SUMMARY"

      - if: steps.pending.outputs.count > 0
        name: Back up the database
        env:
          DATABASE_URL: ${{ secrets.HOSTED_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: ee/ops/backup/backup-db.sh out/database

      - if: steps.pending.outputs.count > 0
        uses: actions/upload-artifact@v7
        with:
          name: database-before-migrate
          path: out/database/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - if: steps.pending.outputs.count > 0
        uses: pnpm/action-setup@v6
      - if: steps.pending.outputs.count > 0
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - if: steps.pending.outputs.count > 0
        run: pnpm install --frozen-lockfile

      - if: steps.pending.outputs.count > 0
        name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.HOSTED_DATABASE_URL }}
        run: |
          pnpm --filter @the-artifact/api db:migrate
          echo "Applied ${{ steps.pending.outputs.count }} migration(s)" >> "$GITHUB_STEP_SUMMARY"

      # success() is also true when the database secrets are missing and the steps above were skipped,
      # so production keeps deploying before backups are set up
      - name: Deploy production
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK is not set, so nothing deploys main (see ee/ops/runbook.md)"
            exit 1
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
          echo "Production deployment started" >> "$GITHUB_STEP_SUMMARY"
