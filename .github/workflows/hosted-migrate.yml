name: Hosted migrate

# Applies new migrations to the hosted service's database on every push to main. The Vercel function
# never runs them, so without this a release that adds a table ships code that queries a table that
# isn't there (it happened with 0016-0022). A backup runs first and is kept like the nightly ones.
# Runs on every push, not only ones that touch migrations, so Vercel can require this check before it
# promotes any production deployment (Deployment Checks); pushes without a new migration finish in
# about a minute. Skipped until HOSTED_DATABASE_URL exists. See ee/ops/runbook.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hosted-migrate
  cancel-in-progress: false

permissions:
  contents: read

env:
  PG_MAJOR: 17

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - id: configured
        env:
          HOSTED_DATABASE_URL: ${{ secrets.HOSTED_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          if [ -n "$HOSTED_DATABASE_URL" ] && [ -n "$BACKUP_AGE_RECIPIENT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Migrations are off: set HOSTED_DATABASE_URL and BACKUP_AGE_RECIPIENT (see ee/ops/runbook.md)"
          fi

      - if: steps.configured.outputs.ok == 'true'
        uses: actions/checkout@v7

      - if: steps.configured.outputs.ok == 'true'
        name: Install age and the Postgres client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends age "postgresql-client-$PG_MAJOR"
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"

      - if: steps.configured.outputs.ok == 'true'
        id: pending
        name: Count pending migrations
        env:
          DATABASE_URL: ${{ secrets.HOSTED_DATABASE_URL }}
        run: |
          expected=$(grep -c '"tag"' apps/api/drizzle/meta/_journal.json)
          applied=$(psql "$DATABASE_URL" -Atc "select count(*) from drizzle.__drizzle_migrations")
          echo "count=$((expected - applied))" >> "$GITHUB_OUTPUT"
          echo "$applied of $expected migrations applied" >> "$GITHUB_STEP_SUMMARY"

      - if: steps.pending.outputs.count > 0
        name: Back up the database
        env:
          DATABASE_URL: ${{ secrets.HOSTED_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: ee/ops/backup/backup-db.sh out/database

      - if: steps.pending.outputs.count > 0
        uses: actions/upload-artifact@v7
        with:
          name: database-before-migrate
          path: out/database/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - if: steps.pending.outputs.count > 0
        uses: pnpm/action-setup@v6
      - if: steps.pending.outputs.count > 0
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - if: steps.pending.outputs.count > 0
        run: pnpm install --frozen-lockfile

      - if: steps.pending.outputs.count > 0
        name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.HOSTED_DATABASE_URL }}
        run: |
          pnpm --filter @the-artifact/api db:migrate
          echo "Applied ${{ steps.pending.outputs.count }} migration(s)" >> "$GITHUB_STEP_SUMMARY"
