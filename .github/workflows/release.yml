name: Release

# release-please keeps a release PR open with the next version and its changelog, built from the
# conventional commits merged to main. Merging that PR tags vX.Y.Z, creates the GitHub release and
# publishes the image, then the Helm chart. The CLI in packages/cli has release PRs of its own:
# merging one tags cli-vX.Y.Z and publishes it to npm. See docs/upgrading.md and CONTRIBUTING.md.
on:
  push:
    branches: [main]

# Two runs must not edit the release PR or create the same release at once
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # The unprefixed outputs are the server's (the "." package); the CLI's are prefixed with its path
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      cli_release_created: ${{ steps.release.outputs['packages/cli--release_created'] }}
      cli_tag_name: ${{ steps.release.outputs['packages/cli--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      # The generated notes list what changed; what operators have to do is written by hand in
      # docs/upgrading.md, under "## Upgrading to X.Y.Z", and added to the release here
      - name: Add the upgrade notes to the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          awk -v heading="## Upgrading to $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' docs/upgrading.md > section.md
          # Links in docs/ are in-app paths (/docs/<slug>, #anchor); on the release page they have to
          # point at the docs on GitHub
          docs="https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs"
          sed -E -e "s|\]\(/docs/([a-z0-9-]+)|](${docs}/\1.md|g" -e "s|\]\(#|](${docs}/upgrading.md#|g" section.md > upgrading.md
          if [ -z "$(tr -d '[:space:]' < upgrading.md)" ]; then
            echo "No upgrade notes for $VERSION"
            exit 0
          fi
          # GitHub drops the dots from heading anchors: "Upgrading to 0.2.0" is #upgrading-to-020
          anchor="upgrading-to-${VERSION//./}"
          {
            gh release view "$TAG" --json body --jq .body
            printf '\n## Upgrading\n'
            cat upgrading.md
            printf '\nThe same notes are in the docs: [Upgrading to %s](https://github.com/%s/blob/%s/docs/upgrading.md#%s).\n' "$VERSION" "$GITHUB_REPOSITORY" "$TAG" "$anchor"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md

  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.release-please.outputs.version }}

  # After the image, so a published chart never names an image that failed to publish
  chart:
    needs: [release-please, image]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Push the chart to ghcr.io/<owner>/charts/the-artifact
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # The release PR has bumped both in Chart.yaml already; passing them keeps a missed marker from
          # publishing the wrong version
          helm package deploy/helm/the-artifact --version "$VERSION" --app-version "$VERSION"
          helm push "the-artifact-$VERSION.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

  # The CLI versions on its own (tags cli-vX.Y.Z, packages/cli/CHANGELOG.md). npm trusts this
  # workflow as the package's trusted publisher (OIDC), so there is no npm token to keep or rotate.
  cli:
    needs: release-please
    if: needs.release-please.outputs.cli_release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # gh release edit below
      contents: write
      # npm trusted publishing, and provenance: the package is signed as built by this workflow
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.cli_tag_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --filter @the-artifact/cli
      - run: pnpm --filter @the-artifact/cli lint
      - run: pnpm --filter @the-artifact/cli test
      # npm, not pnpm, for trusted publishing; prepack builds dist and copies the LICENSE in
      - run: npm publish --provenance --access public
        working-directory: packages/cli
      # GitHub marks the newest release as latest; that stays the server's
      - run: gh release edit "$TAG" --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.cli_tag_name }}
